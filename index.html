<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JoJo’s Bizarre 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,700;1,900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a0b3b;--pink:#ff2e88;--yel:#ffd400;--teal:#00d1c1;--paper:#fff4d6;--ra:#ff2e88;--rb:#b0145e;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(var(--ra) 0 7deg,var(--rb) 7deg 14deg);animation:spin 50s linear infinite;transition:background 0s}
.dots{position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.28) 1.6px,transparent 1.7px) 0 0/11px 11px;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0))}
#stage.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
.sfx{position:absolute;top:calc(8% + env(safe-area-inset-top,0));left:6%;right:6%;font-weight:900;font-style:italic;font-size:clamp(40px,14vw,68px);line-height:1;color:var(--yel);-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000;transform:rotate(-7deg);letter-spacing:.04em;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:rotate(-7deg) scale(.2);opacity:0}}
.figure{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:clamp(110px,38vw,170px);line-height:1;filter:drop-shadow(6px 6px 0 #000);animation:pop .5s .05s both cubic-bezier(.3,1.6,.5,1)}
.box{position:relative;background:var(--paper);border:4px solid #000;box-shadow:7px 7px 0 #000;padding:22px 18px 16px;transform:rotate(-1deg);font-size:17px;line-height:1.55;font-weight:500;min-height:130px}
.who{position:absolute;top:-17px;left:12px;background:var(--yel);border:3px solid #000;padding:2px 12px;font-weight:900;font-style:italic;transform:skew(-10deg);font-size:15px}
.figure svg{width:min(52vw,230px);height:auto}.radar text{font-family:'Be Vietnam Pro',Arial,sans-serif}
.btn{font:inherit;font-weight:900;font-style:italic;font-size:18px;background:var(--yel);color:#000;border:4px solid #000;box-shadow:5px 5px 0 #000;padding:10px 22px;margin-top:14px;cursor:pointer;transform:skew(-6deg)}
.btn:active{transform:skew(-6deg) translate(3px,3px);box-shadow:2px 2px 0 #000}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.right{display:flex;justify-content:flex-end}
h1{margin:0 0 6px;font-weight:900;font-style:italic;font-size:clamp(34px,11vw,52px);line-height:1;-webkit-text-stroke:2px #000;paint-order:stroke fill;color:var(--yel);text-shadow:4px 4px 0 var(--pink),7px 7px 0 #000}
.sub{font-weight:700;margin:6px 0 12px}
label{display:block;font-weight:700;font-size:14px;margin-top:8px}
input{width:100%;font:inherit;font-weight:700;padding:9px 10px;border:3px solid #000;background:#fff;margin-top:3px}
.radar{position:absolute;top:calc(6% + env(safe-area-inset-top,0));left:50%;width:min(88vw,380px);transform:translateX(-50%);filter:drop-shadow(5px 5px 0 #000)}
.radar polygon.v{transform-origin:100px 100px;animation:grow 1.1s .3s both cubic-bezier(.3,1.4,.5,1)}
@keyframes grow{from{transform:scale(0)}}
.bar{height:26px;border:4px solid #000;background:#fff;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#ff6fb0 8px 16px);transition:width .1s}
.ora{font-size:26px;padding:16px 30px}
@media (prefers-reduced-motion:reduce){.rays,#stage.shake,.sfx,.figure,.radar polygon.v{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="rays" id="rays"></div><div class="dots"></div><div id="stage"></div></div>
<script>
(function(){
var P=new URLSearchParams(location.search);
var to=P.get('to')||'Bảo Anh',from=P.get('from')||'Minh';
var pal=[['#ff2e88','#b0145e'],['#ffd400','#ff8a00'],['#00d1c1','#0a5fd6'],['#8a3ffc','#2b0f6b']];
var stage=document.getElementById('stage'),rays=document.getElementById('rays');
var i=-1,timer=null,full='',box=null;
var T=function(s){return s.replace(/\{to\}/g,to).replace(/\{from\}/g,from)};
var scenes=[
 {k:'say',sfx:'GO GO GO GO',fig:'😨',who:'???',t:'Khoan đã... có một luồng khí lạ đang tiến lại gần cậu, {to} à.'},
 {k:'say',sfx:'DON!',fig:'🫵',who:'{from}',t:'Là tớ đây, {from}! Hôm nay tớ nhận lệnh từ Dr D để... ui, cậu đẹp quá à!'},
 {k:'say',sfx:'BAAAM!',fig:'😎',who:'{from}',t:'Sắp 20/10 rồi nên tớ muốn chúc cậu thật nhiều sức khỏe, thật xinh đẹp, và luôn giữ nụ cười trên môi.'},
 {k:'stand'},
 {k:'dio'},
 {k:'say',sfx:'TADAAA!',fig:'BOUQUET',who:'{from}',t:'Tớ tặng cậu bó hoa cúc này nè. Cầm lấy đi, chúc cậu gặp thật nhiều điều may mắn!'},
 {k:'ora'},
 {k:'end'}
];
function shake(){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}}
function bg(n){var p=pal[n%pal.length];rays.style.setProperty('--ra',p[0]);rays.style.setProperty('--rb',p[1]);document.getElementById('app').style.setProperty('--ra',p[0])}
function cover(){
 bg(0);i=-1;
 stage.innerHTML='<div class="sfx">GO GO GO</div><div class="figure" style="top:20%">'+bouquet()+'</div><div class="box"><h1>JoJo’s Bizarre 20/10</h1><div class="sub">Cuộc phiêu lưu kỳ lạ dành cho bạn thân</div><label>Tên bạn thân<input id="a" value="'+esc(to)+'" placeholder="vd: Mai" autocomplete="off"></label><label>Tên của bạn<input id="b" value="'+esc(from)+'" placeholder="vd: Tiny" autocomplete="off"></label><div class="right"><button class="btn" id="go">Bắt đầu!</button></div></div>';
 document.getElementById('go').onclick=function(){
  to=document.getElementById('a').value.trim()||'cậu';from=document.getElementById('b').value.trim()||'tớ';next()};
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function next(){
 clearInterval(timer);i++;var s=scenes[i];bg(i+1);shake();
 if(s.k==='say')say(s);else if(s.k==='stand')stand(0);else if(s.k==='dio')stand(1);else if(s.k==='ora')ora();else end();
}
function say(s){
 full=T(s.t);
 stage.innerHTML='<div class="sfx">'+s.sfx+'</div><div class="figure">'+(s.fig==='BOUQUET'?bouquet():s.fig)+'</div><div class="box"><div class="who">'+esc(T(s.who))+'</div><span id="tx"></span><div class="right"><button class="btn" id="nx">Tiếp ▶</button></div></div>';
 var tx=document.getElementById('tx'),n=0,btn=document.getElementById('nx');
 var done=false;
 timer=setInterval(function(){n++;tx.textContent=full.slice(0,n);if(n>=full.length){clearInterval(timer);done=true}},28);
 btn.onclick=function(){if(!done){clearInterval(timer);tx.textContent=full;done=true}else next()};
}
function stand(n){
 var d=SD(n),L=d.L,V=d.V,pts=[],lab='',ax='';
 for(var k=0;k<6;k++){var a=(-90+60*k)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  pts.push((100+70*V[k]*c).toFixed(1)+','+(100+70*V[k]*s).toFixed(1));
  ax+='<line x1="100" y1="100" x2="'+(100+70*c).toFixed(1)+'" y2="'+(100+70*s).toFixed(1)+'" stroke="#000" stroke-width="1.5"/>';
  lab+='<text x="'+(100+80*c).toFixed(1)+'" y="'+(100+80*s+(s>.1?10:s<-.1?-5:4)).toFixed(1)+'" font-size="11" font-weight="900" text-anchor="'+(Math.abs(c)<.1?'middle':c>0?'start':'end')+'" fill="#000" stroke="#fff4d6" stroke-width="3" paint-order="stroke">'+L[k]+'</text>'}
 var hex=[1,.66,.33].map(function(r){var q=[];for(var k=0;k<6;k++){var a=(-90+60*k)*Math.PI/180;q.push((100+70*r*Math.cos(a)).toFixed(1)+','+(100+70*r*Math.sin(a)).toFixed(1))}return'<polygon points="'+q.join(' ')+'" fill="'+(r===1?'#fff4d6':'none')+'" stroke="#000" stroke-width="2"/>'}).join('');
 stage.innerHTML='<svg class="radar" viewBox="-40 -14 280 224" role="img" aria-label="'+d.w+'">'+hex+ax+'<polygon class="v" points="'+pts.join(' ')+'" fill="'+d.c+'" fill-opacity=".85" stroke="#000" stroke-width="3"/>'+lab+'</svg>'+
 '<div class="box"><div class="who">'+d.w+'</div>'+d.b+'<div class="right"><button class="btn" id="nx">Tiếp ▶</button></div></div>';
 document.getElementById('nx').onclick=next;
}
function SD(n){var t=esc(to);return n?{L:['Sức mạnh','Tốc độ','Tầm xa','Độ bền','Chính xác','Tiềm năng'],V:[1,1,.5,1,.75,.75],c:'#ffd400',w:'DIO xuất hiện!',b:'<b>The World</b> (Stand của DIO)<br>Sức mạnh A · Tốc độ A · Tầm xa C · Độ bền A<br>Dừng được thời gian, nhưng không dừng nổi nụ cười của '+t+'. ZA WARUDO!'}:{L:['Sức khỏe','Xinh đẹp','Nụ cười','May mắn','Độ thân','Tiềm năng'],V:[.95,1,1,.9,1,1],c:'#ff2e88',w:'Stand của '+t,b:'<b>Chrysanthemum Requiem</b><br>Sức mạnh A+ · Tốc độ S · Tiềm năng vô hạn<br>Năng lực: làm mọi người xung quanh cười theo.'}}
function bouquet(){
 var F=[[120,50,'#fff','#ffd400'],[64,92,'#ffd400','#ff8a00'],[176,92,'#ff9ccf','#ff2e88'],[92,128,'#fff','#ff9ccf'],[148,128,'#fff4d6','#ffd400']],s='<svg viewBox="0 0 240 280" role="img" aria-label="Bó hoa cúc"><g stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
 s+='<ellipse cx="62" cy="150" rx="26" ry="9" transform="rotate(-30 62 150)" fill="#2ecc71"/><ellipse cx="178" cy="150" rx="26" ry="9" transform="rotate(30 178 150)" fill="#2ecc71"/>';
 F.forEach(function(f){s+='<path d="M'+f[0]+' '+f[1]+' Q'+((f[0]+120)/2)+' 170 120 214" fill="none" stroke="#1e9e50" stroke-width="5"/>'});
 s+='<path d="M48 148 L192 148 L130 268 L110 268 Z" fill="#ff5fa8"/><path d="M48 148 L120 216 L192 148 Z" fill="#fff4d6"/><path d="M120 216 L96 202 L96 230 Z" fill="#ffd400"/><path d="M120 216 L144 202 L144 230 Z" fill="#ffd400"/><circle cx="120" cy="216" r="7" fill="#ff2e88"/>';
 F.forEach(function(f){var o='',k;for(k=0;k<16;k++)o+='<ellipse cx="0" cy="-19" rx="6" ry="17" fill="'+f[2]+'" transform="rotate('+k*22.5+')"/>';for(k=0;k<12;k++)o+='<ellipse cx="0" cy="-11" rx="4.5" ry="11" fill="'+f[3]+'" transform="rotate('+(k*30+15)+')"/>';o+='<circle r="6" fill="#fff4d6"/>';s+='<g transform="translate('+f[0]+' '+f[1]+') scale(.82)">'+o+'</g>'});
 return s+'</g></svg>'}
function ora(){
 var c=0;
 stage.innerHTML='<div class="sfx">ORA ORA ORA!</div><div class="figure">👊</div><div class="box"><div class="who">Thử thách cuối</div>Nhấn thật nhanh nút ORA để mở khóa lời nhắn cuối cùng!<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="pb"></i></div><div class="right"><button class="btn ora" id="hit">ORA!</button></div></div>';
 var pb=document.getElementById('pb'),h=document.getElementById('hit');
 h.onclick=function(){c++;pb.style.width=Math.min(100,c*4)+'%';shake();if(c>=25){h.disabled=true;setTimeout(next,350)}};
}
function end(){
 stage.innerHTML='<div class="sfx">20/10<br>YATTA!</div><div class="figure">'+bouquet()+'</div><div class="box"><div class="who">{from}</div>'.replace('{from}',esc(from))+
 'Chúc Lê Bảo Anh 20/10 thật vui, thật xinh, và luôn vip pro skibidi toilet. Minh rất là vui khi năm nay vô tình gặp được Banh, người bạn vip pro nhất mà đó giờ minh từng nói chuyện luôn, quý Banh vô cùng &gt;&lt;.'+
 '<div class="right" style="gap:10px;flex-wrap:wrap"><button class="btn" id="sh">Chia sẻ</button><button class="btn" id="rp">Chơi lại</button></div><div id="msg" style="font-size:13px;font-weight:700;margin-top:8px"></div></div>';
 document.getElementById('rp').onclick=cover;
 document.getElementById('sh').onclick=function(){
  var u=location.origin+location.pathname+'?to='+encodeURIComponent(to)+'&from='+encodeURIComponent(from);
  var d={title:'JoJo’s Bizarre 20/10',text:'Có một món quà bí ẩn dành cho '+to+'!',url:u};
  var m=document.getElementById('msg');
  if(navigator.share){navigator.share(d).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){m.textContent='Đã sao chép liên kết!'},function(){m.textContent=u})}
  else m.textContent=u;
 };
}
cover();
})();
</script>
</body>
</html>
